[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['hamingjur*']

[tool.setuptools.package-data]
hamingjur = ['py.typed', '*.txt']
'hamingjur.ui' = ['translations.json']

[tool.setuptools.dynamic]
version = {attr = 'hamingjur.__version__'}

[project]
name = 'hamingjur'
description = """\
    A fork of Blessed with Kitty, Silkie and sixel terminal graphics.\
"""
authors = [
    {name = 'Adam DePrince'},
    {name = 'Jeff Quast'},
    {name = 'Erik Rose'},
    {name = 'Avram Lubkin'},
]
maintainers = [{name = 'Adam DePrince'}]

classifiers = [
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Environment :: Console :: Curses',
    'Operating System :: POSIX',
    'Operating System :: Microsoft :: Windows',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: User Interfaces',
    'Topic :: Terminals',
    'Typing :: Typed',
]
dependencies = [
    'wcwidth>=0.9.2',
    'jinxed>=2.1,<3',
    'Pillow>=9.1',
    'resvg-py>=0.3.1',
]
dynamic = ['version']
license = 'MIT'
license-files = ['LICENSE']
keywords = ['terminal', 'sequences', 'tty', 'curses', 'ncurses', 'formatting',
            'style', 'color', 'console', 'keyboard', 'ansi', 'xterm']
readme = 'docs/intro.rst'
requires-python = '>=3.9'

[project.optional-dependencies]
docs = [
    'Sphinx>3',
    'sphinx-paramlinks',
    'sphinx_rtd_theme',
    'sphinxcontrib-manpage',
]

[project.urls]
Homepage = 'https://hamingjur.goblinreactor.com'
Documentation = 'https://hamingjur.goblinreactor.com/#api'
Repository = 'https://github.com/adamdeprince/hamingjur'
Issues = 'https://github.com/adamdeprince/hamingjur/issues'

[tool.pylint.main]
load-plugins = [
    'pylint.extensions.check_elif',
    'pylint.extensions.docparams',
    'pylint.extensions.dunder',
    'pylint.extensions.for_any_all',
    'pylint.extensions.mccabe',
    'pylint.extensions.overlapping_exceptions',
    'pylint.extensions.redefined_loop_name',
    'pylint.extensions.redefined_variable_type',
    'pylint.extensions.set_membership',
    'pylint.extensions.consider_ternary_expression',
]
persistent = false
# Change back to 0 when dill>=0.4.1 is released
# https://github.com/pylint-dev/pylint/issues/11528
jobs = 1

[tool.pylint.'messages control']
enable = ['all']
disable= [
    'fixme',
    'locally-disabled',
    'suppressed-message',
    'wrong-import-order',
    'wrong-import-position',
    'too-few-public-methods',
    'use-implicit-booleaness-not-comparison-to-zero',
]

[tool.pylint.format]
max-line-length = 100
good-names = ['ks', 'fd', '_', 'x' ,'y']

[tool.pylint.parameter_documentation]
default-docstring-type= 'sphinx'
accept-no-raise-doc = false
accept-no-param-doc = true
accept-no-return-doc = true

[tool.pylint.design]
max-args = 10
max-attributes = 7
max-branches = 12
max-complexity = 11
max-locals = 15
max-module-lines = 2000
max-parents = 7
max-public-methods = 20
max-returns = 7
max-statements = 50

[tool.pylint.similarities]
ignore-imports = true
min-similarity-lines = 8

[tool.pylint.reports]
reports = false
msg-template = '{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}'
